name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁文件一致性）
        run: pnpm install --frozen-lockfile

      - name: 类型检查（全部包）
        run: pnpm -r typecheck

      - name: 构建（全部包）
        run: pnpm -r build

      - name: 重新打包归档 + 生成索引（--stable 确定性输出，验证与提交内容一致）
        run: |
          node scripts/pack.mjs
          node scripts/build-registry.mjs --stable

      - name: 一致性校验（registry/ 生成后不得有差异：索引 + 归档）
        run: git diff --exit-code registry/ || (echo '::error::registry/ 过期或归档缺失，请运行 node scripts/pack.mjs && node scripts/build-registry.mjs 后提交' && exit 1)
