name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查（全部包）
        run: pnpm -r typecheck

      - name: 构建（全部包）
        run: pnpm -r build

      - name: 生成安装源索引
        run: node scripts/build-registry.mjs

      - name: 索引一致性校验（生成后不得有差异）
        run: git diff --exit-code registry/registry.json || (echo '::error::registry/registry.json 过期，请运行 node scripts/build-registry.mjs 后提交' && exit 1)
